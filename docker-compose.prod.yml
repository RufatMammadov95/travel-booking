services:
    discovery-service:
        image: ${DOCKER_REGISTRY}/discovery-service:${IMAGE_TAG}
        ports:
            - "8761:8761"
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 10

    api-gateway:
        image: ${DOCKER_REGISTRY}/api-gateway:${IMAGE_TAG}
        ports:
            - "8080:8080"
        depends_on:
            discovery-service:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 10

    flight-service:
        image: ${DOCKER_REGISTRY}/flight-service:${IMAGE_TAG}
        ports:
            - "8081:8081"
        depends_on:
            discovery-service:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 10

    hotel-service:
        image: ${DOCKER_REGISTRY}/hotel-service:${IMAGE_TAG}
        ports:
            - "8082:8082"
        depends_on:
            discovery-service:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/actuator/health || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 10

    car-rental-service:
        image: ${DOCKER_REGISTRY}/car-rental-service:${IMAGE_TAG}
        ports:
            - "8083:8083"
        depends_on:
            discovery-service:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://localhost:8083/actuator/health || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 10
